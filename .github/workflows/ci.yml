name: CI

# Branch policy: this repository's default branch is `main` (not `master`). CI
# runs on push and pull_request to ALL branches. This is a verification gate
# only — a green run is not a release or shipment decision. Note: git history is
# NOT rewritten here; changing history requires the owner's explicit G2
# authorization. Commit messages that say "[gate: ... pass]" are not evidence;
# only this workflow's output is.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install "pytest==9.1.1" "pytest-cov==7.1.0"
          python -m pip install --no-deps -e .

      - name: Scaffold check
        run: python scripts/check-scaffold.py

      - name: Offline + no-LLM static scan
        run: python scripts/check-offline.py

      - name: All checks (scaffold, offline, determinism)
        run: bash scripts/run-all-checks.sh

      - name: Pytest with coverage
        run: python -m pytest --cov=src/signoff -q

      - name: Build Docker image
        run: docker build -t signoff:ci .

      - name: Run demo with --network none
        run: |
          mkdir -p "$PWD/out/ci-demo"
          # Run as the runner uid so the bind-mounted output directory is
          # writable without world-writable permissions (HI-10).
          docker run --rm --network none --read-only \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/out/ci-demo:/out" signoff:ci demo --out /out/demo
          test -s "$PWD/out/ci-demo/demo/dossier.html"
          test -s "$PWD/out/ci-demo/demo/dossier.pdf"

      # ME-15: agent-directive files must carry the quarantine header so an
      # automated agent does not treat their contents as commands.
      - name: ME-15 agent-instruction guard
        run: python scripts/verify_agent_instruction_files.py

      # GOVERNANCE.md section 2: the root holds only the documented set. The gate parses
      # that table out of GOVERNANCE.md, asserts both directions (every named document is
      # present, and no unlisted .md/.txt sits at the root), and self-tests that it fails
      # closed. It needs nothing but python3 and a checkout.
      - name: Root-document hygiene (GOVERNANCE.md section 2)
        run: |
          python3 scripts/check_root_docs.py
          python3 scripts/check_root_docs.py --self-test
