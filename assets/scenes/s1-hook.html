<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signoff — 2-minute demo — S1 Hook</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
  body { background: #0d1729; color: #ffffff; font-family: 'Lato', 'DejaVu Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .badge { display: inline-block; background: #b45309; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 40px; border: 2px solid #e89c3c; box-shadow: 0 0 24px rgba(180,83,9,0.35); }
  h1 { font-size: 64px; font-weight: 900; line-height: 1.15; margin-bottom: 32px; max-width: 1200px; }
  .amber { color: #b45309; }
  .sub { font-size: 24px; color: #9fb3c8; max-width: 1000px; line-height: 1.6; margin-top: 20px; }
  .clock { font-size: 48px; font-family: 'DejaVu Sans Mono', monospace; color: #1f6feb; margin-top: 50px; font-weight: 700; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="badge">YOUR CLIENT SENDS AN AI GOVERNANCE QUESTIONNAIRE</div>
  <h1>Every answer must point to a real record.<br><span class="amber">An answer you can't back up.</span></h1>
  <div class="sub">Your team has the records — across spreadsheets.<br>Manual copy-pasting. A stale PDF. A guess here or there.</div>
  <div class="clock">00:00</div>
</body>
</html>
